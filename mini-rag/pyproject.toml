[project]
name = "mini-rag"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cohere>=7.0.5",
    "faiss-cpu>=1.14.3",
    "langchain-core>=1.4.9",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.1",
    "pypdf>=7.2.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.59.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "ruff>=0.15.21",
]

[tool.deptry]
known_first_party = ["app"]
extend_exclude = ["data"]

[tool.deptry.per_rule_ignores]
DEP003 = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

