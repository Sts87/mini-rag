---
- name: Hardening SSH and Install Fail2ban on Oracle Linux 8
  hosts: all
  become: true
  tasks:
    - name: Install Oracle EPEL repository release
      ansible.builtin.dnf:
        name: oracle-epel-release-el8
        state: present
    
    - name: Enable the ol8_developer_EPEL repository
      ansible.builtin.command:
        cmd: dnf config-manager --set-enabled ol8_developer_EPEL
      changed_when: false

    - name: Install Fail2ban and Firewalld integration packages
      ansible.builtin.dnf:
        name:
          - fail2ban
          - fail2ban-firewalld
        state: present
        update_cache: yes
    
    - name: Deploy Fail2ban jail.local configuration
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: '0644'
        content: |
          [DEFAULT]
          bantime = 1h
          findtime = 10m
          maxretry = 2
          banaction = firewallcmd-rich-rules

          [sshd]
          enabled = true
          port = ssh
          backend = systemd
        
    - name: Ensure Fail2ban service is enabled and started
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true