---
name: CI workflow

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            mini-rag

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"
          working-directory: mini-rag/

      - name: Lint
        working-directory: mini-rag/
        run: |
          uv sync --locked
          uv run ruff check src/
          uv run ruff format src/ --check
...